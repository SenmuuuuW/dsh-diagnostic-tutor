# pnpm 11 moved build-script approval here (package.json#pnpm is no longer read).
#
# pnpm >=10 refuses to run a dependency's install scripts until the package is
# approved. This is the SAME gate a DSH user must clear before a git-installed
# plugin may run its `prepare` script — the docs call that "permission to
# execute the package's code on your machine at install time, outside any
# sandbox". That friction is why v0.1.0 will ship a prebuilt artifact rather
# than rely on a GitHub source install (see docs/planning/PLAN.md R9).
#
# esbuild is a dev-only transitive dependency of vitest and never ships in the
# published package.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.1-rc.2'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-layout@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar-right@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar@0.2.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.2'
  - '@deepseek-ai/dsh-fs@0.2.1-rc.2'
  - '@deepseek-ai/dsh-home-paths@0.2.1-rc.2'
  - '@deepseek-ai/dsh-host-webserver@0.2.1-rc.2'
  - '@deepseek-ai/dsh-llm@0.2.1-rc.2'
  - '@deepseek-ai/dsh-ptc-runtime@0.2.1-rc.2'
  - '@deepseek-ai/dsh-sandbox-policy@0.2.1-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.2.1-rc.2'
  - '@deepseek-ai/dsh-scope@0.2.1-rc.2'
  - '@deepseek-ai/dsh-session-projection@0.2.1-rc.2'
